# Hastebin – pastebin for code snippets
# Upstream: https://github.com/toptal/haste-server
# Requires: network npm-proxy (stack npmplus)
# Updates: auto

x-required:
  - ${APP_DOMAIN:?}

x-base: &base
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-hardened: &hardened
  <<: *base
  cap_drop:
    - ALL

services:
  app:
    <<: *hardened
    image: rlister/hastebin:latest
    depends_on:
      redis:
        condition: service_healthy
    environment:
      STORAGE_TYPE: redis
      STORAGE_HOST: redis
    networks:
      - npm-proxy
      - internal
    healthcheck:
      test: ["CMD", "wget", "-q", "-s", "http://127.0.0.1:7777/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    pids_limit: 200
    mem_limit: 256m
    labels:
      # Reverse proxy (npmplus-docker-sync)
      npm.proxy.domains: ${APP_DOMAIN}
      npm.proxy.port: "7777"
      npm.proxy.scheme: "http"
      # Monitoring (AutoKuma)
      kuma.hastebin.http.name: "Hastebin"
      kuma.hastebin.http.url: "https://${APP_DOMAIN}"
      kuma.hastebin.http.parent_name: "apps"
      # Dashboard (Homepage)
      homepage.group: "Apps"
      homepage.name: "Hastebin"
      homepage.icon: "hastebin"
      homepage.href: "https://${APP_DOMAIN}"
      homepage.description: "Code snippets"

  redis:
    <<: *hardened
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    cap_add:   # entrypoint fixes ownership of /data and drops to user redis
      - CHOWN
      - SETUID
      - SETGID
    pids_limit: 100
    mem_limit: 256m

volumes:
  redis-data:

networks:
  npm-proxy:
    name: ${NPM_PROXY_NETWORK:-npm-proxy}
    external: true
  internal:
    internal: true
