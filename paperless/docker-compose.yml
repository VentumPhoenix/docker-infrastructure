# Paperless-ngx – document management: scan, OCR, tag and full-text search all your paper documents
# Upstream: https://github.com/paperless-ngx/paperless-ngx
# Requires: network npm-proxy (stack npmplus)
# Updates: manual – updates run database migrations

x-required:
  - ${APP_DOMAIN:?}
  - ${DB_PASSWORD:?}
  - ${PAPERLESS_SECRET_KEY:?openssl rand -hex 32}

x-base: &base
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-hardened: &hardened
  <<: *base
  cap_drop:
    - ALL

services:
  app:
    # Starts as root and drops to user paperless (s6-overlay), so no *hardened
    <<: *base
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PAPERLESS_URL: "https://${APP_DOMAIN}"
      PAPERLESS_TIME_ZONE: ${TZ:-Europe/Berlin}
      PAPERLESS_SECRET_KEY_FILE: /run/secrets/secret_key
      # Files belong to this user on the host side
      USERMAP_UID: ${PUID:-1000}
      USERMAP_GID: ${PGID:-1000}
      # OCR (German and English are included in the image)
      PAPERLESS_OCR_LANGUAGE: ${PAPERLESS_OCR_LANGUAGE:-deu+eng}
      # Database
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBHOST: postgres
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS_FILE: /run/secrets/db_password
      # Task queue
      PAPERLESS_REDIS: redis://redis:6379
    secrets:
      - secret_key
      - db_password
    volumes:
      - app-data:/usr/src/paperless/data
      - app-media:/usr/src/paperless/media
      - app-export:/usr/src/paperless/export
      # Named volume by default. Set PAPERLESS_CONSUME_DIR to a host path for a scanner share.
      - ${PAPERLESS_CONSUME_DIR:-app-consume}:/usr/src/paperless/consume
    networks:
      npm-proxy:
      internal:
      egress:   # fetching documents from mail accounts (IMAP)
        gw_priority: 1   # default route via egress, npm-proxy has no internet
    healthcheck:   # same as the image's own healthcheck
      test: ["CMD", "curl", "-fs", "-S", "-L", "--max-time", "2", "http://127.0.0.1:8000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    pids_limit: 500
    mem_limit: 2g
    labels:
      # Reverse proxy (npmplus-docker-sync)
      npm.proxy.domains: ${APP_DOMAIN}
      npm.proxy.port: "8000"
      npm.proxy.scheme: "http"
      # Large uploads (scanned PDFs)
      npm.proxy.advanced.config: |
        client_max_body_size 0;
      # Monitoring (AutoKuma)
      kuma.paperless.http.name: "Paperless"
      kuma.paperless.http.url: "https://${APP_DOMAIN}"
      kuma.paperless.http.parent_name: "apps"
      # Dashboard (Homepage)
      homepage.group: "Apps"
      homepage.name: "Paperless"
      homepage.icon: "paperless-ngx"
      homepage.href: "https://${APP_DOMAIN}"
      homepage.description: "Documents"

  postgres:
    # Image switches users on startup, so no *hardened
    <<: *base
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - postgres-data:/var/lib/postgresql   # Postgres 18 layout (data in a version subfolder)
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    pids_limit: 200
    mem_limit: 512m

  redis:
    <<: *hardened
    image: redis:8-alpine
    volumes:
      - redis-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    cap_add:   # entrypoint fixes ownership of /data and drops to user redis
      - CHOWN
      - SETUID
      - SETGID
    pids_limit: 100
    mem_limit: 256m

secrets:
  secret_key:
    environment: PAPERLESS_SECRET_KEY
  db_password:
    environment: DB_PASSWORD

volumes:
  app-data:
  app-media:
  app-export:
  app-consume:
  postgres-data:
  redis-data:

networks:
  npm-proxy:
    name: ${NPM_PROXY_NETWORK:-npm-proxy}
    external: true
  internal:
    internal: true
  egress:
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"
