# Wazuh – security monitoring (SIEM/XDR): agents, log analysis, vulnerability detection, file integrity
# Upstream: https://github.com/wazuh/wazuh-docker (single-node)
# Requires: network npm-proxy (stack npmplus), host setting vm.max_map_count=262144, config folder (see README)
# Updates: manual – three components on one version, read the upgrade notes first

x-required:
  - ${APP_DOMAIN:?}
  - ${APP_VERSION:?e.g. 4.14.11}
  - ${WAZUH_INDEXER_PASSWORD:?must match internal_users.yml, see README}
  - ${WAZUH_DASHBOARD_PASSWORD:?must match internal_users.yml, see README}
  - ${WAZUH_API_PASSWORD:?must match wazuh.yml, see README}

x-base: &base
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-hardened: &hardened
  <<: *base
  cap_drop:
    - ALL

services:
  # Dashboard (web UI)
  app:
    # Hardening untested with the Wazuh images
    <<: *base
    image: wazuh/wazuh-dashboard:${APP_VERSION}
    hostname: wazuh.dashboard
    depends_on:
      indexer:
        condition: service_healthy
    environment:
      # Plain env vars: the Wazuh images read credentials only from the environment (CONVENTIONS § 8 fallback)
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: ${WAZUH_INDEXER_PASSWORD}
      WAZUH_API_URL: https://wazuh.manager
      DASHBOARD_USERNAME: kibanaserver
      DASHBOARD_PASSWORD: ${WAZUH_DASHBOARD_PASSWORD}
      API_USERNAME: wazuh-wui
      API_PASSWORD: ${WAZUH_API_PASSWORD}
    volumes:
      # Exception: certificates and config files from the upstream config folder (see README)
      - ${WAZUH_CONFIG_DIR:-/opt/stacks/wazuh/config}/wazuh_indexer_ssl_certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem
      - ${WAZUH_CONFIG_DIR:-/opt/stacks/wazuh/config}/wazuh_indexer_ssl_certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem
      - ${WAZUH_CONFIG_DIR:-/opt/stacks/wazuh/config}/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem
      - ${WAZUH_CONFIG_DIR:-/opt/stacks/wazuh/config}/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
      - ${WAZUH_CONFIG_DIR:-/opt/stacks/wazuh/config}/wazuh_dashboard/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
      - app-config:/usr/share/wazuh-dashboard/data/wazuh/config
      - app-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    networks:
      npm-proxy:
      internal:
        aliases:
          - wazuh.dashboard   # name in the certificates
    healthcheck:   # serves HTTPS with its own certificate; any HTTP answer means it's up
      test: ["CMD-SHELL", "curl -sk -o /dev/null -w '%{http_code}' https://127.0.0.1:5601/ | grep -qE '^(200|302|401)$$'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 3m
    pids_limit: 500
    mem_limit: 1g
    labels:
      # Reverse proxy (npmplus-docker-sync); the dashboard itself speaks HTTPS
      npm.proxy.domains: ${APP_DOMAIN}
      npm.proxy.port: "5601"
      npm.proxy.scheme: "https"
      # Monitoring (AutoKuma)
      kuma.wazuh.http.name: "Wazuh"
      kuma.wazuh.http.url: "https://${APP_DOMAIN}"
      kuma.wazuh.http.parent_name: "security"
      # Dashboard (Homepage)
      homepage.group: "Security"
      homepage.name: "Wazuh"
      homepage.icon: "wazuh"
      homepage.href: "https://${APP_DOMAIN}"
      homepage.description: "Security monitoring"

  manager:
    <<: *base
    image: wazuh/wazuh-manager:${APP_VERSION}
    hostname: wazuh.manager
    environment:
      INDEXER_URL: https://wazuh.indexer:9200
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: ${WAZUH_INDEXER_PASSWORD}
      FILEBEAT_SSL_VERIFICATION_MODE: full
      SSL_CERTIFICATE_AUTHORITIES: /etc/ssl/root-ca.pem
      SSL_CERTIFICATE: /etc/ssl/filebeat.pem
      SSL_KEY: /etc/ssl/filebeat.key
      API_USERNAME: wazuh-wui
      API_PASSWORD: ${WAZUH_API_PASSWORD}
    volumes:
      - manager-api-config:/var/ossec/api/configuration
      - manager-etc:/var/ossec/etc
      - manager-logs:/var/ossec/logs
      - manager-queue:/var/ossec/queue
      - manager-multigroups:/var/ossec/var/multigroups
      - manager-integrations:/var/ossec/integrations
      - manager-active-response:/var/ossec/active-response/bin
      - manager-agentless:/var/ossec/agentless
      - manager-wodles:/var/ossec/wodles
      - manager-filebeat-etc:/etc/filebeat
      - manager-filebeat-var:/var/lib/filebeat
      # Exception: certificates and ossec.conf from the upstream config folder
      - ${WAZUH_CONFIG_DIR:-/opt/stacks/wazuh/config}/wazuh_indexer_ssl_certs/root-ca-manager.pem:/etc/ssl/root-ca.pem
      - ${WAZUH_CONFIG_DIR:-/opt/stacks/wazuh/config}/wazuh_indexer_ssl_certs/wazuh.manager.pem:/etc/ssl/filebeat.pem
      - ${WAZUH_CONFIG_DIR:-/opt/stacks/wazuh/config}/wazuh_indexer_ssl_certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key
      - ${WAZUH_CONFIG_DIR:-/opt/stacks/wazuh/config}/wazuh_cluster/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf
    ports:
      # Exception: agents connect directly (events and enrollment), not over HTTP
      - "${WAZUH_AGENT_PORT:-1514}:1514"
      - "${WAZUH_ENROLLMENT_PORT:-1515}:1515"
      # Optional: syslog input
      #- "514:514/udp"
    networks:
      internal:
        aliases:
          - wazuh.manager   # name in the certificates and in wazuh.yml
      egress:   # vulnerability feeds and rule updates; also needed for the agent ports
        gw_priority: 1   # default route via egress
    healthcheck:
      test: ["CMD-SHELL", "/var/ossec/bin/wazuh-control status | grep -q 'wazuh-remoted is running'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 3m
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 655360, hard: 655360 }
    pids_limit: 2000
    mem_limit: 2g

  indexer:
    <<: *base
    image: wazuh/wazuh-indexer:${APP_VERSION}
    hostname: wazuh.indexer
    environment:
      OPENSEARCH_JAVA_OPTS: "-Xms${WAZUH_INDEXER_HEAP:-1g} -Xmx${WAZUH_INDEXER_HEAP:-1g}"
    volumes:
      - indexer-data:/var/lib/wazuh-indexer
      # Exception: certificates and config files from the upstream config folder
      - ${WAZUH_CONFIG_DIR:-/opt/stacks/wazuh/config}/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem
      - ${WAZUH_CONFIG_DIR:-/opt/stacks/wazuh/config}/wazuh_indexer_ssl_certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.key
      - ${WAZUH_CONFIG_DIR:-/opt/stacks/wazuh/config}/wazuh_indexer_ssl_certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.pem
      - ${WAZUH_CONFIG_DIR:-/opt/stacks/wazuh/config}/wazuh_indexer_ssl_certs/admin.pem:/usr/share/wazuh-indexer/config/certs/admin.pem
      - ${WAZUH_CONFIG_DIR:-/opt/stacks/wazuh/config}/wazuh_indexer_ssl_certs/admin-key.pem:/usr/share/wazuh-indexer/config/certs/admin-key.pem
      - ${WAZUH_CONFIG_DIR:-/opt/stacks/wazuh/config}/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/config/opensearch.yml
      - ${WAZUH_CONFIG_DIR:-/opt/stacks/wazuh/config}/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml
    networks:
      internal:
        aliases:
          - wazuh.indexer   # name in the certificates and configs
    healthcheck:   # HTTPS with authentication; 200 or 401 means it's up
      test: ["CMD-SHELL", "curl -sk -o /dev/null -w '%{http_code}' https://127.0.0.1:9200/ | grep -qE '^(200|401)$$'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 3m
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    pids_limit: 2000
    mem_limit: 2g

  # One-shot job, only with --profile setup: generates the certificates into the config folder
  certs:
    <<: *base
    image: wazuh/wazuh-certs-generator:0.0.5
    profiles: ["setup"]
    environment:
      CERT_TOOL_VERSION: "4.14"
      CERT_TOOL_REPOSITORY: prod
    volumes:
      - ${WAZUH_CONFIG_DIR:-/opt/stacks/wazuh/config}/wazuh_indexer_ssl_certs/:/certificates/
      - ${WAZUH_CONFIG_DIR:-/opt/stacks/wazuh/config}/certs.yml:/config/certs.yml
    network_mode: none
    restart: "no"   # one-shot job, overrides the anchor

volumes:
  app-config:
  app-custom:
  manager-api-config:
  manager-etc:
  manager-logs:
  manager-queue:
  manager-multigroups:
  manager-integrations:
  manager-active-response:
  manager-agentless:
  manager-wodles:
  manager-filebeat-etc:
  manager-filebeat-var:
  indexer-data:

networks:
  npm-proxy:
    name: ${NPM_PROXY_NETWORK:-npm-proxy}
    external: true
  internal:
    internal: true
  egress:
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"
