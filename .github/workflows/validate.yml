# Validates every compose file with its .env.example, so broken files are caught
# before Dockhand deploys them. Errors fail the run, warnings are shown as annotations.
name: Validate stacks

on:
  push:
  pull_request:

jobs:
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: docker compose config
        run: |
          status=0
          for file in */docker-compose*.yml; do
            if [ ! -s "$file" ]; then
              echo "::notice file=$file::skipped (empty file)"
              continue
            fi
            dir=$(dirname "$file")

            # .env.example with dummy values for empty required variables.
            # Variables of the "REQUIRED FOR VARIANT" blocks are commented out, so they are
            # uncommented here (everything up to the OPTIONAL block).
            env=$(mktemp)
            if [ -f "$dir/.env.example" ]; then
              awk '
                /REQUIRED FOR VARIANT/ { variant = 1 }
                /OPTIONAL/             { variant = 0 }
                variant && /^#[A-Z0-9_]+=/ { sub(/^#/, "") }
                { print }
              ' "$dir/.env.example" | sed -E 's/^([A-Z0-9_]+)=$/\1=ci-dummy/' > "$env"
            fi

            if out=$(docker compose -f "$file" --env-file "$env" config -q 2>&1); then
              if [ -n "$out" ]; then
                echo "::warning file=$file::$(echo "$out" | tr '\n' ' ')"
              fi
              echo "ok    $file"
            else
              echo "::error file=$file::$(echo "$out" | tr '\n' ' ')"
              echo "FAIL  $file"
              status=1
            fi
            rm -f "$env"
          done
          exit $status
