# Heimdall – start page with tiles for all your web apps
# Upstream: https://github.com/linuxserver/Heimdall
# Requires: network npm-proxy (stack npmplus, variant authentik)
# Updates: auto

x-required:
  - ${APP_DOMAIN:?}

x-base: &base
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-hardened: &hardened
  <<: *base
  cap_drop:
    - ALL

services:
  app:
    # linuxserver image: starts as root (s6) and drops to PUID/PGID, so no *hardened
    <<: *base
    image: lscr.io/linuxserver/heimdall:latest
    environment:
      TZ: ${TZ:-Europe/Berlin}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      # Tiles may not query private addresses (protects the LAN from the app)
      ALLOW_INTERNAL_REQUESTS: "false"
    volumes:
      - app-config:/config
    networks:
      npm-proxy:
      egress:   # enhanced tiles fetch live stats from the apps via their public URLs
        gw_priority: 1   # default route via egress, npm-proxy has no internet
    healthcheck:
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    pids_limit: 200
    mem_limit: 256m
    labels:
      # Reverse proxy (npmplus-docker-sync)
      npm.proxy.domains: ${APP_DOMAIN}
      npm.proxy.port: "80"
      npm.proxy.scheme: "http"
      # Authentik forward auth: Heimdall has no login of its own
      npm.proxy.auth_request: "authentik"
      # Monitoring (AutoKuma)
      kuma.heimdall.http.name: "Heimdall"
      kuma.heimdall.http.url: "https://${APP_DOMAIN}"
      kuma.heimdall.http.parent_name: "monitoring"

volumes:
  app-config:

networks:
  npm-proxy:
    name: ${NPM_PROXY_NETWORK:-npm-proxy}
    external: true
  egress:
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"
