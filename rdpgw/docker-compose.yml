# RDPGW – remote desktop gateway (RDP over HTTPS), login via Authentik (OIDC)
# Upstream: https://github.com/bolkedebruin/rdpgw
# Requires: network npm-proxy (stack npmplus), stack authentik
# Updates: auto

x-required:
  - ${APP_DOMAIN:?}
  - ${AUTHENTIK_URL:?e.g. https://auth.example.com:443}
  - ${RDPGW_OIDC_CLIENT_ID:?from the Authentik provider}
  - ${RDPGW_OIDC_CLIENT_SECRET:?from the Authentik provider}
  - ${RDPGW_SESSION_KEY:?openssl rand -hex 16}
  - ${RDPGW_SESSION_ENCRYPTION_KEY:?openssl rand -hex 16}
  - ${RDPGW_PAA_TOKEN_SIGNING_KEY:?openssl rand -hex 16}
  - ${RDPGW_PAA_TOKEN_ENCRYPTION_KEY:?openssl rand -hex 16}

x-base: &base
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-hardened: &hardened
  <<: *base
  cap_drop:
    - ALL

services:
  app:
    <<: *hardened
    image: bolkedebruin/rdpgw:latest
    environment:
      TZ: ${TZ:-Europe/Berlin}
      RDPGW_SERVER__GATEWAY_ADDRESS: ${APP_DOMAIN}
      # Plain env vars for all keys below: RDPGW only reads its config from env/file (CONVENTIONS § 8 fallback)
      # Which RDP hosts may be reached, see README
      RDPGW_SERVER__HOST_SELECTION: unsigned
      # Optional: restrict to a fixed list of hosts
      #RDPGW_SERVER__HOSTS: "desktop-pc:3389"
      # Login via Authentik (OIDC)
      RDPGW_OPEN_ID__PROVIDER_URL: "${AUTHENTIK_URL}/application/o/${RDPGW_OIDC_SLUG:-rdpgw}/"
      RDPGW_OPEN_ID__CLIENT_ID: ${RDPGW_OIDC_CLIENT_ID}
      RDPGW_OPEN_ID__CLIENT_SECRET: ${RDPGW_OIDC_CLIENT_SECRET}
      RDPGW_CLIENT__USERNAME_TEMPLATE: "{{ username }}"
      RDPGW_CAPS__TOKEN_AUTH: "true"
      # Own certificates, no Let's Encrypt inside the container
      RDPGW_SERVER__CERT_FILE: /certs/cert.pem
      RDPGW_SERVER__KEY_FILE: /certs/key.pem
      # Fixed session keys (exactly 32 characters each, all different)
      RDPGW_SERVER__SESSIONKEY: ${RDPGW_SESSION_KEY}
      RDPGW_SERVER__SESSIONENCRYPTIONKEY: ${RDPGW_SESSION_ENCRYPTION_KEY}
      RDPGW_SECURITY__PAATOKENSIGNINGKEY: ${RDPGW_PAA_TOKEN_SIGNING_KEY}
      RDPGW_SECURITY__PAATOKENENCRYPTIONKEY: ${RDPGW_PAA_TOKEN_ENCRYPTION_KEY}
      # Sessions stored in files instead of cookies
      RDPGW_SERVER__SESSION_STORE: file
      RDPGW_CAPS__ENABLE_CLIPBOARD: "true"
      RDPGW_CLIENT__DEFAULTS: /etc/rdpgw/default.rdp
    volumes:
      - app-certs:/certs:ro
      - app-data:/opt/rdpgw
      - app-config:/etc/rdpgw
    # Optional: names for RDP hosts that have no DNS entry
    #extra_hosts:
    #  - "desktop-pc:10.0.0.10"
    networks:
      - npm-proxy
      - egress   # RDP hosts in the LAN / NetBird, OIDC discovery at Authentik
    healthcheck:   # no health endpoint, so check that the gateway process runs (busybox pgrep, Alpine)
      test: ["CMD", "pgrep", "rdpgw"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    pids_limit: 200
    mem_limit: 256m
    labels:
      # Reverse proxy (npmplus-docker-sync)
      npm.proxy.domains: ${APP_DOMAIN}
      npm.proxy.port: "443"
      npm.proxy.scheme: "https"
      # Monitoring (AutoKuma)
      kuma.rdpgw.http.name: "RDP Gateway"
      kuma.rdpgw.http.url: "https://${APP_DOMAIN}"
      kuma.rdpgw.http.parent_name: "infrastructure"
      # Dashboard (Homepage)
      homepage.group: "Infrastructure"
      homepage.name: "RDP Gateway"
      homepage.icon: "rdpgw"
      homepage.href: "https://${APP_DOMAIN}"
      homepage.description: "Remote desktop"

volumes:
  app-certs:
  app-data:
  app-config:

networks:
  npm-proxy:
    name: ${NPM_PROXY_NETWORK:-npm-proxy}
    external: true
  egress:
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"
