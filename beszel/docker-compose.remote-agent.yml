# Beszel – agent for OTHER hosts: reports host and container metrics to the Beszel hub
# Upstream: https://github.com/henrygd/beszel
# Requires: nothing (runs on another host, the hub connects to it). For the hub's own host use docker-compose.agent.yml.
# Updates: auto

x-required:
  - ${BESZEL_HUB_URL:?e.g. https://beszel.example.com}
  - ${BESZEL_AGENT_KEY:?public key from the Beszel UI}
  - ${BESZEL_AGENT_TOKEN:?token from the Beszel UI}
  - ${DOCKER_GID:?ls -ln /var/run/docker.sock shows the group ID}

x-base: &base
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-hardened: &hardened
  <<: *base
  cap_drop:
    - ALL

services:
  agent:
    <<: *hardened
    image: henrygd/beszel-agent:latest
    depends_on:
      socket-proxy:
        condition: service_healthy
    environment:
      HUB_URL: ${BESZEL_HUB_URL}
      KEY_FILE: /run/secrets/agent_key
      TOKEN_FILE: /run/secrets/agent_token
      LISTEN: ${BESZEL_AGENT_PORT:-45876}
      # Docker API through the local socket proxy below, never the socket itself
      DOCKER_HOST: tcp://127.0.0.1:${BESZEL_SOCKET_PROXY_PORT:-2375}
    secrets:
      - agent_key
      - agent_token
    volumes:
      - agent-data:/var/lib/beszel-agent
      # Optional: monitor more disks, one folder per disk (see README)
      #- /mnt/disk1/.beszel:/extra-filesystems/sdb1:ro
    network_mode: host   # real network statistics of the host; the hub connects to LISTEN
    healthcheck:
      test: ["CMD", "/agent", "health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s
    pids_limit: 100
    mem_limit: 128m

  # Read-only Docker API with exactly the calls the agent makes (agent/docker.go)
  socket-proxy:
    <<: *hardened
    image: wollomatic/socket-proxy:1
    user: "65534"
    group_add:
      - "${DOCKER_GID}"
    command:
      - "-loglevel=info"
      - "-listenip=0.0.0.0"
      # Reachable only via 127.0.0.1 on the host (see ports), so any source inside is fine
      - "-allowfrom=0.0.0.0/0"
      - '-allowGET=/(v1\.\d+/)?(_ping|version|info|containers/json|containers/[a-zA-Z0-9][a-zA-Z0-9_.-]*/(json|stats|logs))'
      - '-allowHEAD=/(v1\.\d+/)?_ping'
      - "-watchdoginterval=3600"
      - "-stoponwatchdog"
      - "-allowhealthcheck"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      # Exception: the agent runs in the host network, so it reaches the proxy via localhost only
      - "127.0.0.1:${BESZEL_SOCKET_PROXY_PORT:-2375}:2375"
    networks:
      egress:   # only for the localhost port (not possible on an internal network)
        gw_priority: 1   # default route via egress
    healthcheck:
      test: ["CMD", "./healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    read_only: true
    pids_limit: 50
    mem_limit: 64m

secrets:
  agent_key:
    environment: BESZEL_AGENT_KEY
  agent_token:
    environment: BESZEL_AGENT_TOKEN

volumes:
  agent-data:

networks:
  egress:
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"
