# InfluxDB – Telegraf collector for ANY host: host and container metrics into InfluxDB
# Upstream: https://github.com/influxdata/telegraf
# Requires: nothing (runs on any host, writes to InfluxDB via its public URL). Deploy it on every host to monitor.
# Updates: auto

x-required:
  - ${INFLUXDB_URL:?e.g. https://influx.example.com}
  - ${INFLUXDB_TOKEN:?write token for the bucket}
  - ${DOCKER_GID:?ls -ln /var/run/docker.sock shows the group ID}

x-base: &base
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-hardened: &hardened
  <<: *base
  cap_drop:
    - ALL

services:
  telegraf:
    # Entrypoint sets capabilities on the binary and drops to user telegraf, so no *hardened
    <<: *base
    image: telegraf:alpine
    depends_on:
      socket-proxy:
        condition: service_healthy
    environment:
      # Read the host's system instead of the container's
      HOST_ETC: /hostfs/etc
      HOST_PROC: /hostfs/proc
      HOST_SYS: /hostfs/sys
      HOST_VAR: /hostfs/var
      HOST_RUN: /hostfs/run
      HOST_MOUNT_PREFIX: /hostfs
    configs:
      - source: telegraf-config
        target: /etc/telegraf/telegraf.conf
    secrets:
      - influxdb_token
    volumes:
      # Exception: the whole host filesystem, read-only, for host metrics
      - /:/hostfs:ro
    network_mode: host   # real network statistics of the host
    healthcheck:   # outputs.health answers 200 while Telegraf runs
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:${TELEGRAF_HEALTH_PORT:-8099}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    pids_limit: 100
    mem_limit: 256m

  # Read-only Docker API with only the calls the docker input needs
  socket-proxy:
    <<: *hardened
    image: wollomatic/socket-proxy:1
    user: "65534"
    group_add:
      - "${DOCKER_GID}"
    command:
      - "-loglevel=info"
      - "-listenip=0.0.0.0"
      # Reachable only via 127.0.0.1 on the host (see ports), so any source inside is fine
      - "-allowfrom=0.0.0.0/0"
      - '-allowGET=/(v1\.\d+/)?(_ping|version|info|containers/json|containers/[a-zA-Z0-9][a-zA-Z0-9_.-]*/(json|stats))'
      - '-allowHEAD=/(v1\.\d+/)?_ping'
      - "-watchdoginterval=3600"
      - "-stoponwatchdog"
      - "-allowhealthcheck"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      # Exception: Telegraf runs in the host network, so it reaches the proxy via localhost only
      - "127.0.0.1:${TELEGRAF_SOCKET_PROXY_PORT:-2376}:2375"
    networks:
      egress:   # only for the localhost port (not possible on an internal network)
        gw_priority: 1   # default route via egress
    healthcheck:
      test: ["CMD", "./healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    read_only: true
    pids_limit: 50
    mem_limit: 64m

configs:
  telegraf-config:
    content: |
      [agent]
        interval = "${TELEGRAF_INTERVAL:-30s}"
        flush_interval = "${TELEGRAF_INTERVAL:-30s}"
        hostname = "${TELEGRAF_HOSTNAME:-}"
        omit_hostname = false

      # InfluxDB token from /run/secrets, never in the environment
      [[secretstores.docker]]
        id = "secrets"

      [[outputs.influxdb_v2]]
        urls = ["${INFLUXDB_URL}"]
        token = "@{secrets:influxdb_token}"
        organization = "${INFLUXDB_ORG:-homelab}"
        bucket = "${INFLUXDB_BUCKET:-telegraf}"

      # Health endpoint for the Docker healthcheck, localhost only
      [[outputs.health]]
        service_address = "http://127.0.0.1:${TELEGRAF_HEALTH_PORT:-8099}"
        namepass = ["internal_agent"]

      [[inputs.internal]]

      [[inputs.cpu]]
        percpu = false
        totalcpu = true
      [[inputs.mem]]
      [[inputs.swap]]
      [[inputs.system]]
      [[inputs.processes]]
      [[inputs.disk]]
        ignore_fs = ["tmpfs", "devtmpfs", "devfs", "overlay", "aufs", "squashfs", "nsfs"]
      [[inputs.diskio]]
      [[inputs.net]]
        ignore_protocol_stats = true
      [[inputs.netstat]]

      # Containers through the read-only socket proxy of this file
      [[inputs.docker]]
        endpoint = "tcp://127.0.0.1:${TELEGRAF_SOCKET_PROXY_PORT:-2376}"
        gather_services = false
        perdevice_include = ["cpu"]
        total_include = ["cpu", "blkio", "network"]

secrets:
  influxdb_token:
    environment: INFLUXDB_TOKEN

networks:
  egress:
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"
